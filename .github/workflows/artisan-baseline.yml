name: Artisan baseline

on:
  push:
    branches: [main, 'artisan/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artisan-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Artisan baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
      - name: Verify baseline contract
        run: node --test artisan/baseline.test.cjs
      - name: Validate workflow security
        run: node scripts/ci/validate-workflow-security.js
